apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kurban-ingress
  annotations:
    kubernetes.io/ingress.class: "traefik"
    # Anotasi Rate Limiting Traefik (Maksimal 5 req/s per IP)
    traefik.ingress.kubernetes.io/rate-limit: |
      average: 5
      burst: 1
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kurban-app-svc
            port:
              number: 80